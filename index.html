<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 물체 탐험대 · 물체의 생김새와 종류</title>
<style>
:root{
  --paper:#FBF6EC;
  --card:#FFFFFF;
  --ink:#2E2A26;
  --ink-soft:#7C7369;
  --orange:#F5851F;
  --orange-d:#C9640A;
  --orange-l:#FFF1DC;
  --yellow:#FFC93C;
  --yellow-l:#FFF6D6;
  --green:#3EA76B;
  --green-d:#2C7E4F;
  --green-l:#E7F6ED;
  --sky:#3E9FDB;
  --sky-d:#2B7AAE;
  --sky-l:#E8F4FC;
  --coral:#EF5B4C;
  --coral-d:#C13E31;
  --coral-l:#FDECE9;
  --violet:#8C6BD8;
  --violet-l:#F1EBFD;
  --line:#EADFCB;
  --r:20px;
  --font:'NanumSquareRound','BMJUA','TmoneyRoundWind','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  min-height:100vh;
  background:
    radial-gradient(1100px 460px at 8% -12%, #FFF3DA 0%, rgba(255,243,218,0) 62%),
    radial-gradient(900px 420px at 102% -6%, #E6F4FF 0%, rgba(230,244,255,0) 58%),
    radial-gradient(700px 500px at 50% 120%, #EAF8EF 0%, rgba(234,248,239,0) 60%),
    var(--paper);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.app{max-width:1360px;margin:0 auto;padding:22px 22px 60px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- hero ---------- */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{display:inline-block;font-size:13px;font-weight:800;color:var(--orange-d);
  background:#FFF0D6;border:2px solid #FFD894;border-radius:999px;padding:5px 14px;letter-spacing:.02em}
.hero h1{margin:12px 0 6px;font-size:clamp(30px,3.6vw,46px);line-height:1.05;letter-spacing:-.03em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--orange);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:11px;
  background:var(--yellow);opacity:.5;border-radius:6px;z-index:-1}
.hero p{margin:0;color:var(--ink-soft);font-size:16px;font-weight:600}
.badge{width:118px;height:118px;flex:0 0 auto;filter:drop-shadow(0 10px 16px rgba(201,100,10,.18))}
@media (max-width:640px){.badge{width:82px;height:82px}}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 20px;
  border-bottom:3px dashed var(--line);padding-bottom:18px;align-items:center}
.tab{appearance:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:800;
  color:#8A7F72;background:#fff;border:3px solid var(--line);border-radius:16px;
  padding:11px 18px 12px;display:flex;align-items:center;gap:9px;
  box-shadow:0 4px 0 #EADFCB;transition:transform .12s,box-shadow .12s,background .15s,color .15s}
.tab .n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:9px;background:#F1E9DB;color:#8A7F72;font-size:14px;font-weight:800}
.tab:hover{transform:translateY(-2px)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 #EADFCB}
.tab.on{background:var(--orange);border-color:var(--orange-d);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
.tab.on .n{background:rgba(255,255,255,.28);color:#fff}
.tab .star{font-size:15px}
.tabs .spacer{flex:1}
.tool{appearance:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;color:#8A7F72;
  background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 15px;box-shadow:0 4px 0 #EADFCB}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #EADFCB}
.tool[aria-pressed="true"]{background:var(--green-l);border-color:#B9E3CB;color:var(--green-d)}

/* ---------- panel ---------- */
.panel{display:none;animation:rise .32s cubic-bezier(.2,.8,.3,1)}
.panel.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.bar{position:relative;background:#fff;border:3px solid var(--line);
  border-radius:var(--r);padding:16px 18px 16px 62px;box-shadow:0 6px 0 #F0E7D8;margin-bottom:18px;min-height:62px}
.bar .pencil{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:30px;height:30px}
.bar h2{margin:0;font-size:clamp(16px,1.55vw,21px);font-weight:800;line-height:1.4;padding-right:250px}
.bar .btn{position:absolute;top:50%;transform:translateY(-50%)}
.bar .btn[data-hint]{right:132px}
.bar .btn[data-reset]{right:18px}
.bar .btn:hover{transform:translateY(-50%)}
.bar .btn:active{transform:translateY(-50%) translateY(3px);box-shadow:0 1px 0 #EADFCB}
@media (max-width:720px){
  .bar{padding:16px 18px 70px 62px}
  .bar h2{padding-right:0}
  .bar .btn{top:auto;bottom:16px;transform:none}
  .bar .btn[data-hint]{right:auto;left:62px}
  .bar .btn[data-reset]{right:18px}
  .bar .btn:active{transform:translateY(3px)}
}

.btn{appearance:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;color:#fff;white-space:nowrap;
  background:var(--green);border:none;border-radius:14px;padding:11px 18px;box-shadow:0 4px 0 var(--green-d);
  display:inline-block;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.ghost{background:#fff;color:#8A7F72;border:3px solid var(--line);box-shadow:0 4px 0 #EADFCB}
.btn.ghost:active{box-shadow:0 1px 0 #EADFCB}
.btn.warm{background:var(--orange);box-shadow:0 4px 0 var(--orange-d)}
.btn.warm:active{box-shadow:0 1px 0 var(--orange-d)}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.btn.sky:active{box-shadow:0 1px 0 var(--sky-d)}

/* ---------- two column ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:18px;align-items:start}
@media (max-width:1080px){.cols{grid-template-columns:minmax(0,1fr)}}

.work{background:#fff;border:3px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:0 6px 0 #F0E7D8;min-width:0}
.tray{background:#fff;border:3px solid #F7DDB0;border-radius:var(--r);padding:0 0 14px;
  box-shadow:0 6px 0 #F3E3C6;position:relative;min-width:0}
.tray::before{content:"보기";position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  background:var(--orange);color:#fff;font-weight:800;font-size:14px;padding:5px 22px;border-radius:999px;
  box-shadow:0 3px 0 var(--orange-d);letter-spacing:.06em;white-space:nowrap}
.tray-body{padding:24px 14px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  max-height:min(64vh,660px);overflow-y:auto;overscroll-behavior:contain}
.tray-body::-webkit-scrollbar{width:9px}
.tray-body::-webkit-scrollbar-thumb{background:#EBD9B7;border-radius:9px}

.hintbar{display:flex;align-items:center;gap:10px;background:var(--sky-l);border:2px dashed #B7DCF4;
  border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:14px;font-weight:700;color:#2B7AAE}
.hintbar b{color:#1F5F8B}

/* ---------- draggable ---------- */
.drag{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.drag.dragging{opacity:.3}
.ghost{position:fixed;z-index:9999;pointer-events:none;margin:0!important;
  transform:rotate(-3deg) scale(1.05);box-shadow:0 20px 34px rgba(60,40,10,.22);transition:none}
.sel{outline:4px solid var(--orange);outline-offset:2px;border-radius:16px;
  box-shadow:0 0 0 8px rgba(245,133,31,.16)}
.drop{transition:background .14s,outline-color .14s}
.drophl{outline:4px dashed var(--orange)!important;outline-offset:3px;
  background:#FFFAEE!important;border-radius:16px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}
  40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .42s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.09)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .34s cubic-bezier(.2,.9,.3,1.2)}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.wiggle{animation:wiggle .5s}

/* ---------- shape stickers ---------- */
.sticker{background:#FFF9E6;border:3px solid #F2BC45;border-radius:16px;padding:8px 6px 7px;
  width:100px;display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:0 3px 0 #EFD08A;transition:transform .12s,box-shadow .12s,opacity .2s}
.sticker:hover{transform:translateY(-3px) rotate(-2deg);box-shadow:0 6px 0 #EFD08A}
.sticker .sv{width:56px;height:56px}
.sticker .lb{font-size:12.5px;font-weight:800;color:#A9761A;text-align:center;line-height:1.15}
.shp{width:100%;height:100%;display:block;overflow:visible}
.shp *{fill:var(--yellow-l);stroke:#EFA92F;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.shp .shine{fill:none;stroke:#F6CB6B;stroke-width:4}
/* 입체 공 전용 */
.shp .gball{fill:url(#sphg);stroke:#D3921C;stroke-width:5}
.shp .gline{fill:none;stroke:#D3921C;stroke-width:2.6;opacity:.42}
.shp .gshine{fill:none;stroke:#FFFFFF;stroke-width:5.5;opacity:.9}
.shp .gsh{fill:#E4D3A8;stroke:none;opacity:.9}

/* ---------- rows (stage 1, 2) ---------- */
.rows{display:flex;flex-direction:column;gap:12px}
.crow{display:grid;grid-template-columns:158px minmax(0,1fr);gap:14px;align-items:stretch;
  background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px}
@media (max-width:640px){.crow{grid-template-columns:1fr}}
.crow.ex{border-color:#F3D9AE;background:#FFFCF5}
.crow-key{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:#FFF9E6;border:3px solid #F2BC45;border-radius:14px;padding:8px 4px;position:relative}
.crow.objrow .crow-key{background:#FFEFDD;border-color:#F6C48F}
.crow-key .sv{width:62px;height:62px}
.crow-key .sv.objkey img{width:100%;height:100%;object-fit:contain;display:block}
.crow-key .lb{font-size:13px;font-weight:800;color:#A9761A;text-align:center;line-height:1.15}
.crow.objrow .crow-key .lb{color:#B4601B}
.crow-key .exb{position:absolute;top:-11px;left:10px;background:var(--coral);color:#fff;font-size:11px;
  font-weight:800;padding:2px 9px;border-radius:999px;box-shadow:0 2px 0 var(--coral-d)}
.crow-key::after{content:"";position:absolute;right:-12px;top:calc(50% - 7px);width:11px;height:2.5px;
  background:#DCC9A6;border-radius:3px;box-shadow:0 9px 0 #DCC9A6}
@media (max-width:640px){.crow-key::after{display:none}}
.crow-slots{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:108px;
  background:#FDFAF3;border:3px dashed #E7D6B8;border-radius:14px;padding:10px}
.crow.done .crow-slots{border-style:solid;border-color:#A9DFBF;background:var(--green-l)}
.slotcount{font-size:13px;font-weight:800;color:#C0B49F;margin-left:auto;white-space:nowrap}
.crow.done .slotcount{color:var(--green-d)}

/* ---------- mini card ---------- */
.mini{width:88px;background:#fff;border:3px solid #E9DFCC;border-radius:14px;padding:5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.mini img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:9px;display:block}
.mini span{font-size:11.5px;font-weight:800;color:#6E655A;text-align:center;line-height:1.1}
.mini.sample{border-color:#F6C48F;background:#FFFBF5}
.mini .mini-ex{position:absolute;top:-10px;left:-7px;background:var(--coral);color:#fff;font-size:10px;
  font-weight:800;padding:2px 7px;border-radius:999px;box-shadow:0 2px 0 var(--coral-d);z-index:2}

/* ---------- stage 3 bins ---------- */
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.bins{grid-template-columns:minmax(0,1fr)}}
.bin{border:3px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;
  display:flex;flex-direction:column;min-height:216px}
.bin-h{display:flex;align-items:center;gap:9px;padding:10px 14px;font-weight:800;font-size:17px;color:#fff}
.bin-h .cnt{margin-left:auto;font-size:13px;font-weight:800;background:rgba(255,255,255,.3);
  border-radius:999px;padding:3px 11px}
.bin-body{flex:1;padding:14px 12px 12px;display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;
  min-height:124px;transition:background .14s}
.bin.cup .bin-h{background:var(--sky)}   .bin.cup .bin-body{background:var(--sky-l)}
.bin.tissue .bin-h{background:var(--orange)} .bin.tissue .bin-body{background:var(--orange-l)}
.bin.towel .bin-h{background:var(--green)} .bin.towel .bin-body{background:var(--green-l)}
.bin.pot .bin-h{background:var(--violet)} .bin.pot .bin-body{background:var(--violet-l)}
.bin.full{outline:3px solid #A9DFBF;outline-offset:-3px}

/* ---------- stage 4 ---------- */
.pzwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.pzwrap{grid-template-columns:minmax(0,1fr)}}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:470px;margin:0 auto;
  aspect-ratio:1/1;background:#fff;border:4px solid var(--line);border-radius:18px;padding:7px;
  box-shadow:0 6px 0 #F0E7D8}
.pz-cell{border-radius:10px;background-size:300% 300%;background-repeat:no-repeat;position:relative;overflow:hidden}
.pz-cell.empty{border:3px dashed #D8C7A6;background:#FDFAF3!important;display:flex;
  align-items:center;justify-content:center}
.pz-cell.empty::after{content:"?";font-size:26px;font-weight:800;color:#D8C7A6}
.pz-cell.filled{animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.pz-tile{width:96px;height:96px;border-radius:12px;background-size:300% 300%;background-repeat:no-repeat;
  border:3px solid #fff;box-shadow:0 4px 10px rgba(90,70,30,.2);touch-action:none;cursor:grab}
.pz-tile:hover{transform:translateY(-3px)}
.tray-empty{width:100%;text-align:center;color:#B9AC98;font-weight:800;font-size:14px;padding:22px 6px;line-height:1.6}
.qcard{margin-top:18px;background:#fff;border:3px solid #F3D9AE;border-radius:18px;padding:18px;
  box-shadow:0 6px 0 #F3E3C6;display:none}
.qcard.on{display:block;animation:rise .35s cubic-bezier(.2,.8,.3,1)}
.qcard h3{margin:0 0 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.choices{text-align:left}
.choice{appearance:none;font-family:inherit;cursor:pointer;font-size:16px;font-weight:800;color:var(--ink);
  background:#FDFAF3;border:3px solid var(--line);border-radius:16px;padding:12px 20px;min-width:150px;
  box-shadow:0 4px 0 #EADFCB;transition:transform .1s,box-shadow .1s;margin:0 10px 10px 0;vertical-align:top}
.choice:hover{transform:translateY(-2px)}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 #EADFCB}
.choice .ch-em{font-size:24px;line-height:1;margin-right:9px;vertical-align:-4px;display:inline-block}
.choice.right{background:var(--green-l);border-color:#8FD3AB;color:var(--green-d);box-shadow:0 4px 0 #8FD3AB}
.choice.wrong{background:var(--coral-l);border-color:#F2B7AF;color:var(--coral-d);opacity:.6}
.qmsg{margin-top:6px;font-weight:800;font-size:16px;min-height:24px}
.rounds{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.rdot{font-size:13px;font-weight:800;color:#B9AC98;background:#fff;border:3px solid var(--line);
  border-radius:999px;padding:4px 13px}
.rdot.on{background:var(--orange);border-color:var(--orange-d);color:#fff}
.rdot.fin{background:var(--green-l);border-color:#8FD3AB;color:var(--green-d)}

/* ---------- progress ---------- */
.prog{display:flex;align-items:center;gap:14px;margin-top:16px;background:#fff;border:3px solid var(--line);
  border-radius:16px;padding:12px 16px;box-shadow:0 5px 0 #F0E7D8;flex-wrap:wrap}
.prog-txt{font-weight:800;font-size:15px;white-space:nowrap}
.prog-txt b{color:var(--orange);font-size:19px}
.prog-track{flex:1;min-width:140px;height:16px;background:#F1E9DB;border-radius:999px;overflow:hidden}
.prog-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--orange));
  transition:width .35s cubic-bezier(.2,.8,.3,1)}
.stars{font-size:17px;letter-spacing:1px;white-space:nowrap}

/* ---------- toast / celebrate ---------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,26px);z-index:9000;
  background:var(--ink);color:#fff;font-weight:800;font-size:16px;padding:13px 24px;border-radius:999px;
  box-shadow:0 12px 26px rgba(40,30,10,.28);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--green)}
.toast.bad{background:var(--coral)}

.celebrate{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;
  background:rgba(46,42,38,.42);backdrop-filter:blur(3px);padding:20px}
.celebrate.on{display:flex}
.cel-card{background:#fff;border-radius:26px;padding:34px 34px 28px;text-align:center;max-width:460px;width:100%;
  box-shadow:0 26px 60px rgba(40,30,10,.3);border:5px solid var(--yellow);animation:pop .42s cubic-bezier(.2,.9,.3,1.2)}
.cel-card .big{font-size:56px;line-height:1;margin-bottom:10px}
.cel-card h3{margin:0 0 8px;font-size:26px;font-weight:800}
.cel-card p{margin:0 0 22px;color:var(--ink-soft);font-weight:700;font-size:15px;line-height:1.5}
.cel-btns{margin-top:2px;text-align:center}
.cel-btns .btn{margin:5px 5px 0;vertical-align:top}
.confetti{position:fixed;top:-14px;width:11px;height:15px;z-index:9600;pointer-events:none;border-radius:2px;
  animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(760deg);opacity:.85}}

.foot{margin-top:30px;text-align:center;color:#A99C8A;font-size:13px;font-weight:700;line-height:1.7}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <radialGradient id="sphg" cx="34%" cy="28%" r="78%">
    <stop offset="0%" stop-color="#FFFEF6"/>
    <stop offset="42%" stop-color="#FFE7A0"/>
    <stop offset="100%" stop-color="#DFA82F"/>
  </radialGradient>
</defs></svg>

<div class="app">

  <header class="hero">
    <div>
      <span class="eyebrow">초등 과학 · 물체의 생김새와 종류</span>
      <h1>우리 집 <em>물체 탐험대</em></h1>
      <p>집 안의 물체를 살펴보고, 생김새와 종류를 찾아봅시다.</p>
    </div>
    <svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="54" fill="#FFC93C"/>
      <circle cx="60" cy="60" r="54" fill="none" stroke="#C9640A" stroke-width="5"/>
      <circle cx="54" cy="52" r="24" fill="#E8F4FC" stroke="#2E2A26" stroke-width="6"/>
      <path d="M71 69 L96 94" stroke="#2E2A26" stroke-width="11" stroke-linecap="round"/>
      <path d="M44 44 a15 15 0 0 1 12-7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <path d="M46 54 h16 v14 h-16 z" fill="#F5851F" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
      <path d="M46 54 l7-6 h16 l-7 6 z" fill="#FFD98A" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
      <path d="M62 48 v14 l7 6 v-14 z" fill="#D96C0A" stroke="#2E2A26" stroke-width="4" stroke-linejoin="round"/>
    </svg>
  </header>

  <nav class="tabs" id="tabs" aria-label="게임 단계"></nav>

/* ---------------- sound ---------------- */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ AC = null; } }
  if(AC && AC.state === 'suspended'){ AC.resume().catch(function(){}); }
  return AC;
}
function tone(f, t0, dur, type, vol){
  if(muted) return;
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  const s = c.currentTime + t0;
  g.gain.setValueAtTime(0.0001, s);
  g.gain.linearRampToValueAtTime(vol || .15, s + .02);
  g.gain.exponentialRampToValueAtTime(.0001, s + dur);
  o.connect(g); g.connect(c.destination);
  o.start(s); o.stop(s + dur + .06);
}
function sfxOk(){ tone(784,0,.12); tone(1046,.09,.17); }
function sfxNo(){ tone(233,0,.15,'triangle',.12); tone(185,.11,.2,'triangle',.12); }
function sfxWin(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f, i*.1, .28); }); }

/* ---------------- generic drag engine ---------------- */
let drag = null, sel = null, hlEl = null, suppressClick = false;

function bindDrag(el, payload){
  el.classList.add('drag');
  el.setAttribute('tabindex','0');
  el.setAttribute('role','button');
  el.__payload = payload;
  el.addEventListener('pointerdown', function(ev){
    if(el.classList.contains('used')) return;
    ev.preventDefault();
    drag = { el:el, payload:payload, sx:ev.clientX, sy:ev.clientY, moved:false, ghost:null };
  });
  el.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' || ev.key === ' '){
      ev.preventDefault();
      if(el.classList.contains('used')) return;
      toggleSel(el, payload);
    }
  });
}
function dropAt(x,y){
  const e = document.elementFromPoint(x,y);
  return e ? e.closest('.drop') : null;
}
function clearHL(){ if(hlEl){ hlEl.classList.remove('drophl'); hlEl = null; } }
function clearSel(){ if(sel){ sel.el.classList.remove('sel'); } sel = null; }

function toggleSel(el, payload){
  if(sel && sel.el === el){ clearSel(); return; }
  clearSel();
  sel = { el:el, payload:payload };
  el.classList.add('sel');
  tone(620,0,.06,'sine',.07);
}

document.addEventListener('pointerdown', function(){ suppressClick = false; }, true);

document.addEventListener('pointermove', function(ev){
  if(!drag) return;
  if(!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > 8){
    drag.moved = true;
    const r = drag.el.getBoundingClientRect();
    const g = drag.el.cloneNode(true);
    g.className = drag.el.className + ' ghost';
    g.style.width = r.width + 'px';
    g.style.height = r.height + 'px';
    g.style.left = r.left + 'px';
    g.style.top = r.top + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.ox = drag.sx - r.left;
    drag.oy = drag.sy - r.top;
    drag.el.classList.add('dragging');
  }
  if(drag.ghost){
    ev.preventDefault();
    drag.ghost.style.left = (ev.clientX - drag.ox) + 'px';
    drag.ghost.style.top  = (ev.clientY - drag.oy) + 'px';
    const t = dropAt(ev.clientX, ev.clientY);
    if(hlEl && hlEl !== t) clearHL();
    if(t){ hlEl = t; t.classList.add('drophl'); }
  }
}, {passive:false});

document.addEventListener('pointerup', function(ev){
  if(!drag) return;
  const d = drag; drag = null;
  clearHL();
  if(d.ghost){
    d.ghost.remove();
    d.el.classList.remove('dragging');
    suppressClick = true;
    const t = dropAt(ev.clientX, ev.clientY);
    if(t) attemptDrop(d.el, d.payload, t);
    else clearSel();
  }else{
    toggleSel(d.el, d.payload);
  }
});
document.addEventListener('pointercancel', function(){
  if(drag && drag.ghost){ drag.ghost.remove(); drag.el.classList.remove('dragging'); }
  drag = null; clearHL();
});

document.addEventListener('click', function(ev){
  if(suppressClick) return;
  const t = ev.target.closest('.drop');
  if(!t || !sel) return;
  const s = sel; clearSel();
  attemptDrop(s.el, s.payload, t);
});

function attemptDrop(el, payload, target){
  const c = controllers[state.cur];
  if(c && c.drop) c.drop(el, payload, target);
}

function tileStyle(pic, idx){
  const col = idx % 3, row = Math.floor(idx / 3);
  return 'background-image:url(' + picURL(pic) + ');background-size:300% 300%;background-position:' +
         (col * 50) + '% ' + (row * 50) + '%;';

function paintStage4(){
  const D = STAGE_DATA[4];
  const r = D.rounds[state.pz.round];
  const grid = document.getElementById('pzgrid');
  const tray = document.getElementById('tray4');
  if(!grid || !tray) return;
  let gh = '', th = '';
  for(let i = 0; i < 9; i++){
    const hidden = r.hide.indexOf(i) >= 0;
    const placed = state.pz.placed.indexOf(i) >= 0;
    if(hidden && !placed){
      gh += '<div class="pz-cell empty drop" data-idx="' + i + '"></div>';
    }else{
      gh += '<div class="pz-cell' + (hidden ? ' filled' : '') + '" style="' + tileStyle(r.pic, i) + '"></div>';
    }
  }
  grid.innerHTML = gh;
  r.tray.forEach(function(i){
    if(state.pz.placed.indexOf(i) >= 0) return;
    th += '<div class="pz-tile" data-idx="' + i + '" style="' + tileStyle(r.pic, i) + '" aria-label="조각"></div>';
  });
  tray.innerHTML = th || '<div class="tray-empty">조각을 모두 제자리에<br>놓았어요! 🎉</div>';
  const qc = document.getElementById('qcard');

  document.getElementById('choices').innerHTML = '';
  tray.querySelectorAll('.pz-tile').forEach(function(el){
    bindDrag(el, { type:'tile', idx: parseInt(el.dataset.idx, 10) });
  });
  const left = r.hide.length - state.pz.placed.length;
  if(state.cur === 4 && left > 0) toast('그림 조각 ' + left + '개를 맞춰 보세요!', null);

        b.classList.add('right');
        document.getElementById('qmsg').innerHTML =
          '<span style="color:#2C7E4F">정답이에요! 이것은 <b>' + c[2] + ' ' + PIC_NAME[r.pic] + '</b> 입니다. 🎉</span>';
        sfxWin(); confetti(30);
        const last = state.pz.round >= D.rounds.length - 1;
        celebrate('🎊', '정답!', PIC_NAME[r.pic] + ' 그림을 완성했어요.', last
          ? [{label:'탐험 마치기', cls:'warm', act:function(){ stageCleared(4); }}]
          : [{label:'다음 그림 →', cls:'warm', act:function(){ nextPuzzle(); }},
             {label:'닫기', cls:'ghost'}]);
      }else{
        b.classList.add('wrong');
        sfxNo();
        document.getElementById('qmsg').innerHTML =
          '<span style="color:#C13E31">다시 살펴보세요. 완성된 그림과 이모티콘을 잘 보세요!</span>';
      }
    };
    box.appendChild(b);
  });
  qc.classList.add('on');
  qc.scrollIntoView({ behavior:'smooth', block:'nearest' });
}
function nextPuzzle(){
  const D = STAGE_DATA[4];
  if(state.pz.round >= D.rounds.length - 1){ stageCleared(4); return; }
  state.pz.round++;
  state.pz.placed = [];
  renderPanel(4);
}

/* ============================================================
   controllers
   ============================================================ */
const controllers = {};

function rowsDrop(stage){
  return function(el, payload, target){
    if(payload.type !== 'obj') return;
    const slot = target.closest('.crow-slots');
    if(!slot) return;
    const want = parseInt(slot.dataset.row, 10);
    const D = STAGE_DATA[stage];
    if(D.rows[want].sample) return;
    if(payload.row === want){
      const cnt = slot.querySelector('.slotcount');
      slot.insertBefore(el, cnt);
      el.classList.add('pop');
      el.style.pointerEvents = 'none';
      el.removeAttribute('tabindex');
      el.setAttribute('role','img');
      el.classList.remove('sel');
      sel = null;
      const n = slot.querySelectorAll('.mini').length;
      cnt.textContent = n + ' / ' + D.rows[want].items.length;
      if(n >= D.rows[want].items.length) slot.closest('.crow').classList.add('done');
      sfxOk();
      state.done[stage]++;
      updateProgress(stage);
      if(state.done[stage] >= state.total[stage]) stageCleared(stage);
    }else{
      flash(slot, 'shake');
      flash(el, 'wiggle');
      sfxNo();
      toast('생김새가 비슷한 물체끼리 모아야 해요!', 'bad');
    }
  };
}
controllers[1] = { drop: rowsDrop(1) };
controllers[2] = { drop: rowsDrop(2) };

controllers[3] = {
  drop: function(el, payload, target){
    if(payload.type !== 'obj') return;
    const bin = target.closest('.bin');
    if(!bin) return;
    const want = bin.dataset.cat;
    if(payload.cat === want){
      el.classList.add('pop');
      el.style.pointerEvents = 'none';
      el.removeAttribute('tabindex');
      el.setAttribute('role','img');
      el.classList.remove('sel');
      sel = null;
      target.appendChild(el);
      const cat = STAGE_DATA[3].cats.filter(function(c){ return c.id === want; })[0];
      const n = target.querySelectorAll('.mini').length;
      bin.querySelector('[data-bcnt]').textContent = n + ' / ' + cat.items.length;
      if(n >= cat.items.length) bin.classList.add('full');
      sfxOk();
      state.done[3]++;
      updateProgress(3);
      if(state.done[3] >= state.total[3]) stageCleared(3);
    }else{
      flash(bin, 'shake');
      flash(el, 'wiggle');
      sfxNo();
      toast('이 물체는 어디에 쓰는 물건일까요?', 'bad');
    }
  }
};

controllers[4] = {
  drop: function(el, payload, target){
    if(payload.type !== 'tile') return;
    const cell = target.closest('.pz-cell');
    if(!cell) return;
    const idx = parseInt(cell.dataset.idx, 10);
    const r = STAGE_DATA[4].rounds[state.pz.round];
    if(payload.idx === idx){
      state.pz.placed.push(idx);
      state.done[4]++;
      updateProgress(4);
      sfxOk();
      paintStage4();
      if(state.pz.placed.length >= r.hide.length) setTimeout(showQuestion, 340);
    }else{
      flash(cell, 'shake');
      flash(el, 'wiggle');
      sfxNo();
      toast('그 자리에 어울리는 조각을 찾아보세요!', 'bad');
    }
  }
};

/* ============================================================
   shell
   ============================================================ */
function barHTML(stage, instr){
  return '<div class="bar">' +
    '<svg class="pencil" viewBox="0 0 32 32" aria-hidden="true">' +
      '<path d="M6 26l2-7L22 5l5 5L13 24z" fill="#FFC93C" stroke="#2E2A26" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M6 26l2-7 5 5z" fill="#F5851F" stroke="#2E2A26" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<path d="M22 5l5 5" stroke="#2E2A26" stroke-width="2.4"/>' +
    '</svg>' +
    '<h2>' + instr + '</h2>' +
    '<button type="button" class="btn ghost" data-hint="' + stage + '">힌트</button>' +
    '<button type="button" class="btn ghost" data-reset="' + stage + '">처음부터</button>' +
  '</div>';
}
function progHTML(stage){
  return '<div class="prog" data-prog="' + stage + '">' +
    '<span class="prog-txt">완성 <b class="prog-num">0</b> / ' + state.total[stage] + '개</span>' +
    '<span class="prog-track"><span class="prog-fill"></span></span>' +
    '<span class="stars">·</span>' +
  '</div>';
}
function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = STAGE_KEYS.map(function(s){
    const D = STAGE_DATA[s];
    return '<button type="button" class="tab' + (state.cur === s ? ' on' : '') + '" data-stage="' + s + '">' +
      '<span class="n">' + s + '</span>' + D.icon + ' ' + D.name +
      (state.clear[s] ? ' <span class="star">⭐</span>' : '') + '</button>';
  }).join('') +
  '<span class="spacer"></span>' +
  '<button type="button" class="tool" id="mute" aria-pressed="false">🔊 소리</button>' +
  '<button type="button" class="tool" id="resetall">↺ 전체 초기화</button>';
  t.querySelectorAll('[data-stage]').forEach(function(b){
    b.onclick = function(){ goStage(parseInt(b.dataset.stage, 10)); };
  });
  document.getElementById('mute').onclick = function(){
    muted = !muted;
    this.setAttribute('aria-pressed', String(muted));
    this.textContent = muted ? '🔇 소리' : '🔊 소리';
  };
  document.getElementById('resetall').onclick = function(){ resetAll(); };
}
function renderPanel(stage){
  const fn = { 1:renderStage1, 2:renderStage2, 3:renderStage3, 4:renderStage4 }[stage];
  const box = document.getElementById('panels');
  const old = document.getElementById('panel-' + stage);
  const html = fn();
  if(old){ old.outerHTML = html; } else { box.insertAdjacentHTML('beforeend', html); }
  wireStage(stage);
}
function wireStage(stage){
  const p = document.getElementById('panel-' + stage);
  if(!p) return;
  p.querySelectorAll('[data-reset]').forEach(function(b){
    b.onclick = function(){ resetStage(stage); };
  });
  p.querySelectorAll('[data-hint]').forEach(function(b){
    b.onclick = function(){
      if(!sel){ toast('먼저 물체를 눌러 고르세요.', null); return; }
      const t = findTarget(stage, sel.payload);
      if(t){ flash(t, 'drophl', 1200); toast('여기를 보세요!', 'good'); }
      else toast('힌트를 찾을 수 없어요.', null);
    };
  });
  document.querySelectorAll('.panel').forEach(function(el){
    el.classList.toggle('on', el.id === 'panel-' + stage);
  });

  if(stage === 1 || stage === 2){
    p.querySelectorAll('#tray' + stage + ' .mini').forEach(function(el){
      bindDrag(el, { type:'obj', obj: el.dataset.obj, row: parseInt(el.dataset.row, 10) });
    });
  }
  if(stage === 3){
    p.querySelectorAll('#tray3 .mini').forEach(function(el){
      bindDrag(el, { type:'obj', obj: el.dataset.obj, cat: el.dataset.cat });
    });
  }
  if(stage === 4){ paintStage4(); }
  updateProgress(stage);
}
function findTarget(stage, payload){
  if(stage === 1 || stage === 2){
    const el = document.querySelector('#panel-' + stage + ' .crow-slots[data-row="' + payload.row + '"]');
    if(el) return el;
  }
  if(stage === 3){
    const el = document.querySelector('#panel-3 .bin[data-cat="' + payload.cat + '"] .bin-body');
    if(el) return el;
  }
  if(stage === 4){
    const el = document.querySelector('#panel-4 .pz-cell[data-idx="' + payload.idx + '"]');
    if(el) return el;
  }
  return null;
}
function resetStage(stage){
  clearSel();
  state.done[stage] = 0;
  state.clear[stage] = false;
  if(stage === 4){ state.pz.round = 0; state.pz.placed = []; }
  renderPanel(stage);
  renderTabs();
  toast('처음부터 다시 시작합니다.', null);
}
function resetAll(){
  STAGE_KEYS.forEach(function(s){ state.done[s] = 0; state.clear[s] = false; });
  state.pz.round = 0; state.pz.placed = [];
  STAGE_KEYS.forEach(function(s){ renderPanel(s); });
  goStage(1);
  toast('모든 단계를 처음부터 시작합니다.', null);
}
function goStage(s){
  state.cur = s;
  STAGE_KEYS.forEach(function(k){
    const el = document.getElementById('panel-' + k);
    if(el) el.classList.toggle('on', k === s);
  });
  renderTabs();
  clearSel();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ---------------- boot ---------------- */
STAGE_KEYS.forEach(function(s){ renderPanel(s); });
renderTabs();
goStage(1);
</script>
